<div class="summary-widget">
  <div class="widget-header">
    <span class="widget-icon">⚡</span>
    <h4>Singleton Service Monitor</h4>
  </div>
  <p class="widget-desc">This widget demonstrates singleton service state sharing.</p>
  <div class="widget-stat">
    <span class="widget-value">{{ coursesCount }}</span>
    <span class="widget-label">Total Shared Courses</span>
  </div>
  <button class="btn-widget" (click)="addSampleCourse()">
    + Add Mock Course (Shared State)
  </button>
</div>
